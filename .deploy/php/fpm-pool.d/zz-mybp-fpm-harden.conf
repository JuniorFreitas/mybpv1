; Hardening MyBP — PHP 8.5 / Remi UBI
; clear_env=yes + whitelist (não herdar secrets extras do container)
[www]
listen.mode = 0660
request_terminate_timeout = 60s
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Whitelist mínima Laravel / MyBP (estender se faltar variável em runtime)
env[APP_NAME] = $APP_NAME
env[APP_ENV] = $APP_ENV
env[APP_KEY] = $APP_KEY
env[APP_DEBUG] = $APP_DEBUG
env[APP_URL] = $APP_URL
env[LOG_CHANNEL] = $LOG_CHANNEL
env[LOG_LEVEL] = $LOG_LEVEL
env[DB_CONNECTION] = $DB_CONNECTION
env[DB_HOST] = $DB_HOST
env[DB_PORT] = $DB_PORT
env[DB_DATABASE] = $DB_DATABASE
env[DB_USERNAME] = $DB_USERNAME
env[DB_PASSWORD] = $DB_PASSWORD
env[REDIS_HOST] = $REDIS_HOST
env[REDIS_PASSWORD] = $REDIS_PASSWORD
env[REDIS_PORT] = $REDIS_PORT
env[REDIS_PREFIX] = $REDIS_PREFIX
env[CACHE_DRIVER] = $CACHE_DRIVER
env[CACHE_PREFIX] = $CACHE_PREFIX
env[QUEUE_CONNECTION] = $QUEUE_CONNECTION
env[SESSION_DRIVER] = $SESSION_DRIVER
env[SESSION_LIFETIME] = $SESSION_LIFETIME
env[MAIL_MAILER] = $MAIL_MAILER
env[MAIL_HOST] = $MAIL_HOST
env[MAIL_PORT] = $MAIL_PORT
env[MAIL_USERNAME] = $MAIL_USERNAME
env[MAIL_PASSWORD] = $MAIL_PASSWORD
env[MAIL_ENCRYPTION] = $MAIL_ENCRYPTION
env[MAIL_FROM_ADDRESS] = $MAIL_FROM_ADDRESS
env[MAIL_FROM_NAME] = $MAIL_FROM_NAME
env[AWS_ACCESS_KEY_ID] = $AWS_ACCESS_KEY_ID
