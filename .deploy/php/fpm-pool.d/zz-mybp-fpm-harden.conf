; Hardening MyBP — PHP 8.5 / Remi UBI
;
; Estratégia (prod ECS rootless UID 101):
; - clear_env=no → worker herda env do container (SSM/TD). Evita outage por
;   variável nova fora de whitelist (já ocorreu com RECAPTCHA e BROADCAST).
; - Sem blocos env[KEY]=$KEY: com clear_env=no eles só sobrescrevem; se $KEY
;   estiver ausente no start, injetam string vazia e quebram defaults do Laravel.
; - ENABLE_CACHE_APP deve permanecer false enquanto houver env() fora de config/
;   (TrustProxies, LoginController, Mails, Blades). Com config:cache, env() vira null.
; - Quando migrar esses env() → config() e ligar config:cache, aí vale revisitar
;   clear_env=yes + whitelist mínima (ou pass-through gerado no start).
[www]
listen.mode = 0660
request_terminate_timeout = 60s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
