; Hardening MyBP — PHP 8.5 / Remi UBI
; Aplicado em runtime por .deploy/scripts/start-phpnginx
; Nota: com listen.acl_users na base, listen.owner/group são ignorados (ACL já inclui nginx).
[www]
listen.mode = 0660
request_terminate_timeout = 60s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
