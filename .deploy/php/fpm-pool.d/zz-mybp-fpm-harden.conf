; Hardening MyBP — PHP 8.5 / Remi UBI
;
; Estratégia (com ENABLE_CACHE_APP=true em prod):
; - clear_env=yes → worker PHP não herda SUPERVISORD_*/ENABLE_*/secrets extras.
; - Sem env[KEY]=$KEY → evita string vazia que anula defaults do Laravel.
; - Prod: start-phpnginx roda config:cache com o env completo do container
;   ANTES do FPM; requests usam bootstrap/cache/config.php (sem getenv).
; - Local (ENABLE_CACHE_APP=false): Dotenv carrega .env no boot do worker
;   (env limpo + arquivo .env). Nunca use env() fora de config/*.
[www]
listen.mode = 0660
request_terminate_timeout = 60s
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
