server {
    # Porta 80 = produção (mybp-prod TD + Traefik). Rootless usa setcap no Dockerfile.
    listen   80;
    listen   [::]:80 default ipv6only=on;

    # Confiar só em redes privadas típicas de LB/proxy (nunca 0.0.0.0/0)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server_tokens off;

    # Alinhado a post_max_size do php.ini-production (uploads maiores → S3/multipart)
    client_max_body_size 100M;

    client_header_timeout 90s;
    client_body_timeout 90s;
    send_timeout 90s;
    keepalive_timeout 90s;

    root /usr/share/nginx/html/public;
    index index.php index.html index.htm;

    error_log /dev/stdout info;
    access_log /dev/stdout;

    # Cabeçalhos de segurança (sempre; assets reaplicam abaixo)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        # Laravel web usa PUT/PATCH/DELETE (ex.: simularUsuario, ativaDesativa)
        limit_except GET HEAD POST PUT PATCH DELETE {
            deny all;
        }
        try_files $uri $uri/ /index.php$is_args$args;
        proxy_read_timeout 1500;
    }

    location ~ \.php$ {
        limit_except GET HEAD POST PUT PATCH DELETE {
            deny all;
        }
        try_files $uri /index.php =404;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 1500;
        include fastcgi_params;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|ttf|woff|woff2)$ {
        expires 1d;
        access_log off;
        add_header Cache-Control "public" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ^~ /.well-known/ {
        allow all;
        default_type text/plain;
    }

    location ~ /\. {
        deny all;
    }

    location ~* /(\.git|\.svn|\.hg|\.bzr) {
        deny all;
    }

    location ~* \.(?:bak|backup|old|orig|save|swp|sql|env)$ {
        deny all;
    }
}
