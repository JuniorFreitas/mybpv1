; MyBPIN — defaults de runtime (Fase A PHP 8.5)
expose_php = Off
memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 120
max_input_vars = 5000
date.timezone = America/Sao_Paulo

; Mitigação CVE-2026-115560 / CVE-2026-109619 (também reforçada via php_admin_flag no pool)
session.upload_progress.enabled = Off
