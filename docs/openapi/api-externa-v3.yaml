        - $ref: '#/components/parameters/processoUf'
        - name: tipo_admissao
          in: query
          schema: { type: string }
          example: CLT
        - name: data_admissao_de
          in: query
          schema: { type: string, format: date }
          example: '2026-01-01'
        - name: data_admissao_ate
          in: query
          schema: { type: string, format: date }
          example: '2026-12-31'
      responses:
        '200':
          description: Lista paginada de processos ativos
          content:
            application/json:
