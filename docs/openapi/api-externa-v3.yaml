      description: |
        Payload alinhado à listagem de Admissão. CPF/Pix/PIS mascarados.
        Inclui `curriculo`, `admissao`, `empresa`, pareceres resumidos e `links`.

        **Como usar**
        ```
        GET /processos/ativos?q=Maria&uf=MA&page=1&per_page=20
        GET /processos/ativos?empresa_public_id={uuid}&tipo_admissao=CLT
        GET /processos/ativos?data_admissao_de=2026-01-01&data_admissao_ate=2026-12-31
        ```

        Em seguida: `GET /processos/{public_id}` para o detalhe completo.
      operationId: processosAtivos
      security:
        - bearerAuth: []
        - oauth2: [processos:read]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/processoQ'
        - $ref: '#/components/parameters/processoCpf'
