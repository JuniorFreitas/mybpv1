openapi: 3.0.3
info:
  title: MyBP API Externa v3
  description: |
    # Introdução

    A **API Externa v3** é a interface oficial do MyBP para sistemas externos, agents de IA
    e integrações **lerem** dados de RH da sua empresa — com isolamento por credencial,
    identificadores públicos (UUID) e tratamento LGPD.

    Use esta API quando precisar consultar efetivo, processos de admissão, currículos,
    vagas, CIH, medidas, relatórios (ASO, férias, aniversariantes, NPS etc.) sem acessar
    o painel web e sem misturar dados de outros clientes.

    ### O que ela oferece

    - REST em JSON no prefixo `/api/v3` — **somente leitura** (GET)
    - Auth por empresa: `client_id` + `client_secret` → Bearer (`POST /oauth/token`)
    - Escopos (`processos:read`, `relatorios:read`, …) controlam o que o token pode acessar
    - Paginação (`page` / `per_page`), envelopes `{ success, data, meta }` e `links` nos recursos
    - Sem IDs numéricos internos; `empresa_id` não aparece no JSON

    ### O que não faz nesta versão

    - Não grava nem altera dados de negócio
    - Não gera Excel/PDF (exports ficam no MyBP web)
    - Não permite escolher outra empresa além da credencial

    ### Para quem

    Integrações ERP/BI, agents, portais parceiros e times de dados que precisam de bases
    de RH em JSON paginado.

    ---

    ## Comece em 3 passos

    1. Solicite ao MyBP o par `client_id` + `client_secret` da sua empresa  
       (`php artisan api-externa:credencial {empresa_id}` — o secret aparece **apenas uma vez**).
    2. Obtenha o token (veja o endpoint **Auth → Obter access_token** abaixo).
    3. Chame um recurso com header `Authorization: Bearer {access_token}` e `Accept: application/json`  
       (exemplo: `GET /processos/ativos?page=1&per_page=20`).

    Renove o token perto de `expires_in` (padrão ~3600s). **Nunca** envie `client_secret` nas rotas de dados.

    ## Convenções

    | Tema | Regra |
    |------|--------|
    | IDs | Sempre `public_id` (UUID). Nunca IDs numéricos internos. |
    | Tenant | `empresa_id` implícito no token — **não** vem no JSON. |
    | Paginação | `page` + `per_page` (máx. 100). Meta em `meta`. |
    | Relatórios | Itens em `data`; totais/resumo extras em `context` (quando houver). |
    | LGPD | CPF mascarado (`***.***.***-XX`); Pix/PIS com sufixo mascarado. |
    | Erros | Sempre JSON `{ "success": false, "msg": "..." }` (nunca HTML). |

    ## Envelope de sucesso

    **Item único**
    ```json
    { "success": true, "data": { "public_id": "3fa85f64-..." } }
    ```

    **Lista paginada**
    ```json
    {
      "success": true,
      "data": [ { "public_id": "..." } ],
      "meta": { "current_page": 1, "per_page": 20, "total": 42, "last_page": 3 },
      "context": { "resumo": {} }
    }
    ```
    (`context` só aparece em relatórios / respostas com metadados agregados.)

    ## Fluxo típico de integração (RH)

    1. `GET /processos/ativos` — colaboradores admitidos  
    2. `GET /processos/{public_id}` — detalhe (currículo, pareceres, admissão, `empresa`)  
    3. Nested: `/etapas`, `/exames`, `/documentos`, `/ferias`, `/pre-admissao`  
    4. Ou `GET /relatorios/efetivo` / `vencimento-asos` para visão consolidada  

    ## Scopes

    O token só acessa os scopes gravados na credencial. Falta de scope → **403**.

    | Scope | Módulo |
    |-------|--------|
    | `cloud:read` | Arquivos Cloud |
    | `fornecedores:read` | Fornecedores e anexos |
    | `avaliacoes:read` | Avaliações de desempenho |
    | `processos:read` | Processos / admissão |
    | `curriculos:read` | Currículos |
    | `fluxo:read` | Fluxo completo |
    | `vagas:read` | Vagas abertas |
    | `centros-custo:read` | Centros de custo |
    | `cih:read` | CIH |
    | `medidas:read` | Medidas administrativas |
    | `historico:read` | Histórico |
    | `pos-admissao:read` | Pós-admissão |
    | `weekly:read` | Weekly Report (quadros, listas e tarefas) |
    | `relatorios:read` | Relatórios do menu RH |

    ## Códigos HTTP

    | HTTP | Significado |
    |------|-------------|
    | 200 | OK |
    | 401 | Token/credencial inválidos |
    | 403 | Escopo insuficiente |
    | 404 | Recurso inexistente **nesta** empresa |
    | 422 | Payload inválido (`errors` nos campos) |
    | 429 | Rate limit |
    | 500 | Erro interno (JSON) |

    ## Documentação

    - Swagger UI: `/api/v3/docs`  
    - Spec OpenAPI: `/api/v3/openapi.yaml`
  version: 3.0.0
  contact:
    name: MyBP Suporte
  license:
    name: Uso restrito — clientes MyBP

servers:
  - url: /api/v3
    description: Relativo ao host MyBP (ex. https://sistema.mybp.com.br/api/v3)
  - url: "http://localhost:8000/api/v3"
    description: Ambiente local

tags:
  - name: Auth
    description: |
      Client credentials (OAuth2-like). Obtenha o Bearer antes de qualquer outra chamada.
      Rate limit dedicado no endpoint de token.
  - name: Cloud
    description: Metadados de pastas/arquivos do Cloud. Downloads retornam binário/stream.
  - name: Fornecedores
    description: Cadastro de fornecedores, serviços e anexos (metadados + download).
  - name: Avaliacoes
    description: Campanhas de avaliação de desempenho, feedbacks e resultado consolidado.
  - name: Processos
    description: |
      Pipeline de admissão (ativos, em andamento, demitidos).
      Payload alinhado às telas internas; IDs públicos; CPF mascarado.
  - name: Curriculos
    description: Currículos vinculados à empresa via processos (feedback).
  - name: Fluxo
    description: Visão completa do processo + mapa booleano de etapas (`fluxo:read`).
  - name: VagasAbertas
    description: Vagas abertas, simulados e projetos.
  - name: CentrosCusto
    description: Centros de custo, filiais e gestores (sem login).
  - name: CIH
    description: Controle de Início Homologado — listagem, tags e colaboradores.
  - name: Medidas
    description: Medidas administrativas (motivo só no detalhe).
  - name: Historico
    description: Histórico de admitidos + nested medidas/afastamentos.
  - name: PosAdmissao
    description: Pós-admissão e entrevista de desligamento sanitizada.
  - name: Weekly
    description: |
      Weekly Report da empresa (quadros, listas, tarefas, checklists e comentários).
      Somente leitura. Sem login de usuário e sem download de anexo.
  - name: Relatorios
    description: |
      Relatórios do menu RH em JSON paginado.
      Catálogo em `GET /relatorios`; execute com `GET /relatorios/{slug}`.
      Totais agregados em `context` (ex.: `resumo`, `graficos`, `mes`).

paths:
  /oauth/token:
    post:
      tags: [Auth]
      summary: Obter access_token (client credentials)
      description: |
        Troca `client_id` + `client_secret` por um Personal Access Token Sanctum.

        **Exemplo cURL**
        ```bash
        curl -s -X POST "$BASE/api/v3/oauth/token" \
          -H "Accept: application/json" \
          -H "Content-Type: application/json" \
          -d '{"grant_type":"client_credentials","client_id":"'"$CLIENT_ID"'","client_secret":"'"$CLIENT_SECRET"'"}'
        ```

        Use o `access_token` no header `Authorization: Bearer ...` das demais rotas.
        Guarde `scope` para saber o que a credencial pode acessar.
      operationId: oauthToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            examples:
              padrao:
                summary: Credenciais da empresa
                value:
                  grant_type: client_credentials
                  client_id: mybp_9f3c2a1b8e7d6c5b
                  client_secret: s3cr3t_exemplo_nao_usar_em_producao
      responses:
        '200':
          description: Token emitido com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                sucesso:
                  summary: Token válido por 1h
                  value:
                    success: true
                    access_token: "1|abcDefGhIjKlMnOpQrStUvWxYz0123456789"
                    token_type: Bearer
                    expires_in: 3600
                    scope: "cloud:read processos:read curriculos:read relatorios:read"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /cloud:
    get:
      tags: [Cloud]
      summary: Listar clouds da empresa
      description: |
        Retorna os clouds (espaços de arquivo) da empresa autenticada.

        Campos úteis: `public_id`, `nome`, `slug`, `ativo`, `usuarios_count`, `itens_count`.

        **Exemplo:** `GET /cloud?ativo=true&q=rh&page=1&per_page=20`
      operationId: cloudIndex
      security:
        - bearerAuth: []
        - oauth2: [cloud:read]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: ativo
          in: query
          schema: { type: boolean }
          description: Filtra clouds ativos/inativos
          example: true
        - name: q
          in: query
          schema: { type: string }
          description: Busca por nome ou slug
          example: documentos
      responses:
        '200':
          description: Lista paginada de clouds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCloud'
              examples:
                exemplo:
                  value:
                    success: true
                    data:
                      - public_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        nome: Documentos RH
                        slug: documentos-rh
                        ativo: true
                        usuarios_count: 12
                        itens_count: 340
                        links:
                          self: /api/v3/cloud/3fa85f64-5717-4562-b3fc-2c963f66afa6
                          itens: /api/v3/cloud/3fa85f64-5717-4562-b3fc-2c963f66afa6/itens
                    meta:
                      current_page: 1
                      per_page: 20
                      total: 1
                      last_page: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /cloud/{publicId}:
    get:
      tags: [Cloud]
      summary: Detalhe do cloud
      description: Membros (admin/grupo) e grupos ativos da empresa.
      security:
        - bearerAuth: []
        - oauth2: [cloud:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'

  /cloud/{publicId}/buscar:
    get:
      tags: [Cloud]
      summary: Buscar itens no cloud
      description: Busca global por label (mín. 2 caracteres). Filtro opcional `tipo`.
      security:
        - bearerAuth: []
        - oauth2: [cloud:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: tipo
          in: query
          schema: { type: string, enum: [pasta, arquivo] }
      responses:
        '200':
          $ref: '#/components/responses/Paginated'
        '422':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /cloud/{publicId}/pastas:
    get:
      tags: [Cloud]
      summary: Listar pastas (árvore)
      description: Somente pastas com contagem de filhos. Use `pasta_public_id` para descer.
      security:
        - bearerAuth: []
        - oauth2: [cloud:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - name: pasta_public_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'

  /cloud/{publicId}/resolver-path:
    get:
      tags: [Cloud]
      summary: Resolver path por slugs
      description: Ex. `path=documentos/rh` → pasta_public_id + breadcrumb.
      security:
        - bearerAuth: []
        - oauth2: [cloud:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - name: path
          in: query
          schema: { type: string }
          example: documentos/rh
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'

  /cloud/{publicId}/itens:
    get:
      tags: [Cloud]
      summary: Itens/metadados do cloud
      description: |
        Navegação na raiz ou em pasta. Filtros: tipo, aprovado, revisado, q, recursivo.
        Cada item traz `links`.
      security:
        - bearerAuth: []
        - oauth2: [cloud:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: pasta_public_id
          in: query
          schema: { type: string, format: uuid }
        - name: tipo
          in: query
          schema: { type: string, enum: [pasta, arquivo] }
        - name: aprovado
          in: query
          schema: { type: boolean }
        - name: revisado
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          schema: { type: string }
        - name: recursivo
          in: query
          schema: { type: boolean }
          description: Inclui descendentes (com ou sem pasta_public_id)
      responses:
        '200':
          $ref: '#/components/responses/Paginated'
        '404':
          $ref: '#/components/responses/NotFound'

  /cloud/{publicId}/itens/{itemPublicId}:
    get:
      tags: [Cloud]
      summary: Detalhe do item + breadcrumb
      description: Inclui `caminho` e `path` (slugs) além do payload completo do item.
      security:
        - bearerAuth: []
        - oauth2: [cloud:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - $ref: '#/components/parameters/itemPublicId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'

  /cloud/{publicId}/itens/{itemPublicId}/download:
    get:
      tags: [Cloud]
      summary: Download do arquivo do item
      security:
        - bearerAuth: []
        - oauth2: [cloud:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - $ref: '#/components/parameters/itemPublicId'
      responses:
        '200':
          description: Stream do arquivo
        '404':
          $ref: '#/components/responses/NotFound'

  /cloud/{publicId}/itens/{itemPublicId}/arquivo:
    get:
      tags: [Cloud]
      summary: Preview/visualização do arquivo
      security:
        - bearerAuth: []
        - oauth2: [cloud:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - $ref: '#/components/parameters/itemPublicId'
      responses:
        '200':
          description: Conteúdo para visualização
        '404':
          $ref: '#/components/responses/NotFound'

  /cloud/{publicId}/itens/{itemPublicId}/thumb:
    get:
      tags: [Cloud]
      summary: Miniatura (quando imagem) ou arquivo
      security:
        - bearerAuth: []
        - oauth2: [cloud:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - $ref: '#/components/parameters/itemPublicId'
      responses:
        '200':
          description: Thumb ou arquivo
        '404':
          $ref: '#/components/responses/NotFound'

  /fornecedores:
    get:
      tags: [Fornecedores]
      summary: Listar fornecedores
      description: |
        Cadastro, endereco_completo, telefones, serviços e links.
        Filtros: q, tipo, tipo_pessoa, ativo, uf, tipo_servico_public_id.
      security:
        - bearerAuth: []
        - oauth2: [fornecedores:read]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: ativo
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          schema: { type: string }
        - name: tipo
          in: query
          schema: { type: string }
        - name: tipo_pessoa
          in: query
          schema: { type: string }
        - name: uf
          in: query
          schema: { type: string }
        - name: tipo_servico_public_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/Paginated'

  /fornecedores/buscar:
    get:
      tags: [Fornecedores]
      summary: Buscar fornecedores
      security:
        - bearerAuth: []
        - oauth2: [fornecedores:read]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: ativo
          in: query
          schema: { type: boolean }
        - name: tipo
          in: query
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Paginated'
        '422':
          $ref: '#/components/responses/Error'

  /fornecedores/tipos-servico:
    get:
      tags: [Fornecedores]
      summary: Catálogo de tipos de serviço
      security:
        - bearerAuth: []
        - oauth2: [fornecedores:read]
      parameters:
        - name: ativo
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /fornecedores/{publicId}:
    get:
      tags: [Fornecedores]
      summary: Detalhe do fornecedor (CPF mascarado)
      description: Detalhe + anexos/serviços com links de download autenticados.
      security:
        - bearerAuth: []
        - oauth2: [fornecedores:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'

  /fornecedores/{publicId}/servicos:
    get:
      tags: [Fornecedores]
      summary: Serviços do fornecedor
      security:
        - bearerAuth: []
        - oauth2: [fornecedores:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - name: ativo
          in: query
          schema: { type: boolean }
        - name: status
          in: query
          schema: { type: string }
        - name: tipo_servico_public_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'

  /fornecedores/{publicId}/servicos/{servicoPublicId}:
    get:
      tags: [Fornecedores]
      summary: Detalhe do serviço
      security:
        - bearerAuth: []
        - oauth2: [fornecedores:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - name: servicoPublicId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '404':
          $ref: '#/components/responses/NotFound'

  /fornecedores/{publicId}/anexos/{arquivoPublicId}/download:
    get:
      tags: [Fornecedores]
      summary: Download anexo do fornecedor
      security:
        - bearerAuth: []
        - oauth2: [fornecedores:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - $ref: '#/components/parameters/arquivoPublicId'
      responses:
        '200':
          description: Stream do arquivo
        '404':
          $ref: '#/components/responses/NotFound'

  /fornecedores/{publicId}/anexos/{arquivoPublicId}/arquivo:
    get:
      tags: [Fornecedores]
      summary: Preview anexo do fornecedor
      security:
        - bearerAuth: []
        - oauth2: [fornecedores:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - $ref: '#/components/parameters/arquivoPublicId'
      responses:
        '200':
          description: Conteúdo para visualização
        '404':
          $ref: '#/components/responses/NotFound'

  /fornecedores/{publicId}/servicos/{servicoPublicId}/anexos/{arquivoPublicId}/download:
    get:
      tags: [Fornecedores]
      summary: Download anexo do serviço
      security:
        - bearerAuth: []
        - oauth2: [fornecedores:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - name: servicoPublicId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/arquivoPublicId'
      responses:
        '200':
          description: Stream do arquivo
        '404':
          $ref: '#/components/responses/NotFound'

  /fornecedores/{publicId}/servicos/{servicoPublicId}/anexos/{arquivoPublicId}/arquivo:
    get:
      tags: [Fornecedores]
      summary: Preview anexo do serviço
      security:
        - bearerAuth: []
        - oauth2: [fornecedores:read]
      parameters:
        - $ref: '#/components/parameters/publicId'
        - name: servicoPublicId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/arquivoPublicId'
      responses:
        '200':
          description: Conteúdo para visualização
        '404':
          $ref: '#/components/responses/NotFound'

  /avaliacoes:
    get:
      tags: [Avaliacoes]
      summary: Listar campanhas de avaliação de desempenho
      description: Tipo, fluxo_etapas, contagens de feedbacks e links.
      security:
        - bearerAuth: []
        - oauth2: [avaliacoes:read]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: status
          in: query
          schema: { type: string }
        - name: ativo
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          schema: { type: string }
        - name: ano_avaliacao
          in: query
          schema: { type: integer }
        - name: tipo_pj
          in: query
          schema: { type: boolean }
        - name: avaliacao_tipo_public_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/Paginated'

  /avaliacoes/tipos:
    get:
      tags: [Avaliacoes]
      summary: Catálogo de tipos de avaliação
      security:
        - bearerAuth: []
        - oauth2: [avaliacoes:read]
      parameters:
        - name: ativo
          in: query
          schema: { type: boolean, default: true }
        - name: tipo_pj
          in: query
          schema: { type: boolean }
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /avaliacoes/tipos-avaliador:
    get:
      tags: [Avaliacoes]
      summary: Catálogo de tipos de avaliador
      security:
        - bearerAuth: []
        - oauth2: [avaliacoes:read]
